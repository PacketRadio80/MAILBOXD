# MailboxD telnet login brute-force (security.log).
# Install: copy to /etc/fail2ban/filter.d/ and enable mailboxd-telnet in jail.d.

[INCLUDES]
before = common.conf

[Definition]
_daemon = mailboxd
failregex = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} login_fail ip=<HOST> user=.* transport=telnet
ignoreregex =
