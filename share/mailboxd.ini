; MailboxD 1.0.0 — Common configuration
; Minimal working config for PRTERM + telnet on FreeBSD/Linux.
; See mailboxd.ini.full for every option and its documentation.

[service]
name            = MAILBX
user            = lighttpd
group           = lighttpd
login_announce  = no

[storage]
backend         = sqlite
path            = data

[auth]
auto_login      = yes

[traffic]
baud            = 2400
line_width      = 80
pace_output     = yes
ansi            = no

[log]
enabled         = yes
dir             = logs
level           = warn

[monitor]
enabled         = yes
follow_mailboxd = yes
follow_security = yes
invisible-sysop = yes
invite_timeout_sec = 20

[security]
enabled         = yes
telnet          = yes

[mail]
enabled         = yes
path            = mail

[networks]
telnet          = yes

[entertain]
enabled         = yes

[broadcast]
enabled         = yes

[beacon]
enabled         = yes
callerid        = MAILBX
interval        = 150
prterm_url      = http://127.0.0.1/prterm.cgi

[transport.mailboxd_prterm]
enabled         = yes
bind            = /var/mailboxd/prterm.sock
mode            = 0660
link_token      = CHANGE_ME

[transport.telnet]
bind            = 0.0.0.0
port            = 2323